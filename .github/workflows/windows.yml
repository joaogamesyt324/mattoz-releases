name: MATTOZ Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mattoz-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar sintaxe
        run: npm run check
      - name: Executar testes
        run: npm test
      - name: Gerar e verificar instalador e portátil
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Guardar executáveis desta compilação
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MATTOZ-Windows-${{ github.sha }}
          path: |
            dist/MATTOZ-*.exe
            dist/release.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publicar apenas uma versão nova
        if: github.repository == 'joaogamesyt324/mattoz-releases' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs
